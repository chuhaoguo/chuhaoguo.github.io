---
layout: default
---
<article class="wrap narrow page">
  <header class="page-head">
    {% if page.eyebrow %}<p class="eyebrow mono">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
    <div class="rule"><span></span></div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>

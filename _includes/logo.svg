<svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
  <!-- canopy: a faint dome, like the outline of a crown of leaves -->
  <path d="M6.2 24.5 A18 18 0 0 1 41.8 24.5" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.6 2.2" opacity="0.55"/>
  <!-- branches: Porphyrian division drawn as a network -->
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 29 V7.5"/>
    <path d="M24 25 L16.5 19 L10.5 15.5 M16.5 19 L15.5 10"/>
    <path d="M24 21.5 L31.5 16.5 L38 14 M31.5 16.5 L33 9.5"/>
  </g>
  <g fill="currentColor">
    <circle cx="24" cy="6.2" r="2.5"/>
    <circle cx="10.5" cy="15.5" r="1.9"/><circle cx="15.5" cy="9.6" r="1.9"/>
    <circle cx="33" cy="9.2" r="1.9"/><circle cx="38" cy="14" r="1.9"/>
    <circle cx="16.5" cy="19" r="1.15"/><circle cx="31.5" cy="16.5" r="1.15"/>
  </g>
  <!-- trunk: a small fluted column -->
  <path d="M18.5 29 H29.5 L28.4 31 H19.6 Z" fill="currentColor"/>
  <g stroke="currentColor" stroke-width="1.2">
    <line x1="21" y1="32" x2="21" y2="40"/><line x1="24" y1="32" x2="24" y2="40"/><line x1="27" y1="32" x2="27" y2="40"/>
  </g>
  <rect x="17.5" y="40.8" width="13" height="1.9" fill="currentColor"/>
  <rect x="14.5" y="43.4" width="19" height="1.9" fill="currentColor"/>
</svg>

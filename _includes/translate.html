<div class="lang notranslate" translate="no">
  <button class="icon-btn lang-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Translate this site">
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    <span class="lang-current">EN</span>
  </button>
  <div class="lang-menu" role="menu">
    <p class="lang-note">Machine translation · Google</p>
    {% for l in site.data.languages %}
    <button type="button" role="menuitem" data-lang="{{ l.code }}" lang="{{ l.code }}">{{ l.native }}<span>{{ l.code }}</span></button>
    {% endfor %}
  </div>
</div>
